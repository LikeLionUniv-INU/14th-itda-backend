services:
  postgres:
    image: postgres:17
    container_name: itda-postgres
    environment:
      POSTGRES_DB: itda
      POSTGRES_USER: itda
      POSTGRES_PASSWORD: itda1234
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    container_name: itda-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: itda-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres-data:
  minio-data:
